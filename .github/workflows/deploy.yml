name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

  deploy-worker:
    name: Deploy Cloudflare Worker
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check Worker deploy prerequisites
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Worker deploy — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 0
          fi
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "::error::Replace REPLACE_WITH_D1_DATABASE_ID in wrangler.toml (commit the real id)."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply step-counter --remote

      - name: Deploy Worker
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy:
    name: Deploy GitHub Pages
    needs: [test, deploy-worker]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WA_SITE_URL: ${{ secrets.WA_SITE_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Set repository secret WORKER_URL before deploying."
            exit 1
          fi
          if [ -z "$WA_SITE_URL" ]; then
            echo "::error::Set repository secret WA_SITE_URL before deploying."
            exit 1
          fi

      - name: Build production config.js
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WA_SITE_URL: ${{ secrets.WA_SITE_URL }}
          JOIN_URL: ${{ secrets.JOIN_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = {
            MODE: 'prod',
            PART: 'all',
            WORKER_URL: process.env.WORKER_URL,
            WA_SITE_URL: process.env.WA_SITE_URL,
            JOIN_URL:
              process.env.JOIN_URL ||
              'https://www.aiwcduesseldorf.org/event-6782449',
            TRACKING_START: process.env.TRACKING_START || '2026-09-01',
            TRACKING_END: process.env.TRACKING_END || '2026-10-31',
          };
          const body =
            '/** Generated by CI — do not edit. */\n' +
            `window.STEP_COUNTER_CONFIG = ${JSON.stringify(config, null, 2)};\n`;
          fs.writeFileSync('config.js', body);
          NODE

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html impressum.html privacy.html robots.txt styles.css config.js favicon.ico favicon.svg apple-touch-icon.svg dist/
          cp -R src dist/src
          # Bust CDN/browser cache for ES module graph after API contract changes
          SHA="${GITHUB_SHA:0:7}"
          sed -i "s|src=\"./src/app.js\"|src=\"./src/app.js?v=${SHA}\"|" dist/index.html
          # Static site only — no Node server, tests, or local CSV data
          find dist -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
