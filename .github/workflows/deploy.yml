name: CI and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build WA widget snippets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          WA_SITE_URL: ${{ secrets.WA_SITE_URL }}
          JOIN_URL: ${{ secrets.JOIN_URL }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -n "$APPS_SCRIPT_URL" ] && [ -n "$WA_SITE_URL" ]; then
            # Default APP_URL to this repo's GitHub Pages URL when secret unset
            if [ -z "$APP_URL" ]; then
              APP_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
              export APP_URL
              echo "APP_URL defaulted to $APP_URL"
            fi
            npm run build:widget
          else
            echo "Skipping widget build (secrets not set)"
          fi

      - name: Upload widget artifacts
        if: hashFiles('dist/aiwcd-steps-widget.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aiwcd-steps-widget
          path: dist/aiwcd-steps-widget.html

  deploy:
    name: Deploy GitHub Pages
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          WA_SITE_URL: ${{ secrets.WA_SITE_URL }}
        run: |
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$WA_SITE_URL" ]; then
            echo "::error::Set repository secrets APPS_SCRIPT_URL and WA_SITE_URL before deploying."
            exit 1
          fi

      - name: Build production config.js
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          WA_SITE_URL: ${{ secrets.WA_SITE_URL }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = {
            MODE: 'prod',
            PART: 'all',
            APPS_SCRIPT_URL: process.env.APPS_SCRIPT_URL,
            WA_SITE_URL: process.env.WA_SITE_URL,
            AUTH_START_PATH: '?action=auth_start',
          };
          const body =
            '/** Generated by CI — do not edit. */\n' +
            `window.STEP_COUNTER_CONFIG = ${JSON.stringify(config, null, 2)};\n`;
          fs.writeFileSync('config.js', body);
          NODE

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html styles.css config.js dist/
          cp -R src dist/src
          # Static site only — no Node server, tests, or local CSV data
          find dist -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
